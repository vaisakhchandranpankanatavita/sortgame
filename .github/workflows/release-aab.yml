name: Build Release AAB

# Builds the Play Store upload bundle (android-release.aab) on GitHub's runners,
# which (unlike some restricted environments) can reach Google's Maven + SDK servers.
#
# Signing uses your EXISTING upload keystore, supplied as encrypted repo secrets so it
# never lives in the repo. Add these under Settings -> Secrets and variables -> Actions:
#   KEYSTORE_BASE64   - base64 of your upload keystore file
#                       (macOS/Linux:  base64 -i upload.jks | tr -d '\n' > keystore.b64)
#                       (Windows PS:   [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload.jks")))
#   KEYSTORE_PASSWORD - the store password
#   KEY_ALIAS         - the key alias
#   KEY_PASSWORD      - the key password
#
# Run it from the Actions tab -> "Build Release AAB" -> Run workflow, then download the
# "release-aab" artifact and upload the .aab in Play Console.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add your upload keystore as a repo secret (see workflow header)."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/upload.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore/upload.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties

      - name: Build release bundle
        run: ./gradlew :android:bundleRelease --no-daemon --stacktrace

      - name: Verify the AAB is signed
        run: |
          AAB=android/build/outputs/bundle/release/android-release.aab
          test -f "$AAB" || { echo "::error::AAB not found at $AAB"; exit 1; }
          BT=$(ls "$ANDROID_SDK_ROOT"/build-tools/* -d | sort -V | tail -1)
          "$BT/apksigner" verify --min-sdk-version 26 --verbose "$AAB" \
            && echo "AAB is signed." \
            || echo "::warning::apksigner could not verify (AAB bundles are jarsigner-signed; Play will re-verify on upload)."

      - name: Clean up signing material
        if: always()
        run: rm -f android/keystore.properties android/keystore/upload.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/build/outputs/bundle/release/android-release.aab
          if-no-files-found: error
          retention-days: 7
